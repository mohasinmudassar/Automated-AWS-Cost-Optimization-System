name: CI

on:
  pull_request:

# No AWS credentials or OIDC federation anywhere in this workflow —
# there is nothing to deploy yet. terraform init runs with -backend=false
# specifically so it never tries to reach the S3 backend (which needs
# real credentials and a bucket that only exists once someone actually
# deploys). See backend.tf's own comment for why the bucket can't be
# created by this same config in the first place.

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform init (no backend)
        run: terraform init -backend=false

      - name: terraform validate
        run: terraform validate

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: tflint --init
        run: tflint --init

      - name: tflint
        run: tflint

      - name: checkov
        run: pip install checkov && checkov -d . --config-file .checkov.yaml

  tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: pip install -r tests/requirements.txt

      - name: pytest
        run: pytest
